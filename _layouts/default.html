---
layout: null
---

<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    {% include head.html %}
  </head>
  <body>
    <header class="page-header" role="banner">
      <h1 class="project-name">{{ site.title }}</h1>
      <h2 class="project-tagline">{{ site.description }}</h2>
    </header>

    <main id="content" class="main-content" role="main">{{ content }}</main>

    <footer class="site-footer">
      <span class="site-footer-owner"> © {{ site.time | date: "%Y" }} {{ site.title }} </span>
    </footer>
  </body>
</html>
